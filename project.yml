name: Runner3D
options:
  bundleIdPrefix: com.edui
targets:
  Runner3D:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Runner3D]
    info:
      path: Runner3D/Info.plist
      properties:
        CFBundleDisplayName: Runner3D
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edui.runner3d
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
